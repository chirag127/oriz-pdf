name: Deploy GH Pages info

on:
  push:
    branches: [main]
    paths:
      - gh-info/**
      - .github/workflows/gh-pages-info.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-info
      - id: deployment
        uses: actions/deploy-pages@v4
